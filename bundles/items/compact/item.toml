# stm.compact — compact mode (#30): fits the stm items into the room each bar
# display has (beside the notch on a notched built-in screen). Installing it
# turns compact mode on; uninstalling it turns it off and every item goes back
# to its full form. Items step down full > short > icon > hidden by their
# `priority` option; hidden items are listed behind a » chevron.
# Its position is fixed: a theme or stm.config.toml may not move it.
name = "compact"
version = "0.2.0"
dialects = ["lua"]
files = ["item.lua", "plugin.sh"]
colors = ["white", "grey", "bg1", "popup_bg", "popup_border"]
default_position = "right"
update_freq = 30
events = ["display_change", "system_woke"]

# How the items are fitted (#31):
#   shrink  items step down full > short > icon > hidden; » lists the hidden
#   page    items stay full; the bar shows the ones that fit, and ‹ › slide
#           that window one item a click (pin items always stay)
[options.mode]
values = ["shrink", "page"]
default = "shrink"
