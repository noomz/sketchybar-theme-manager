# stm.netspeed — download and upload rates of the network link, as graphs
# and numbers (#21).
# Installed with `stm install item:netspeed`; options go in stm.config.toml
# (or a theme's palette) under [item.netspeed].
name = "netspeed"
version = "0.1.0"
dialects = ["lua"]
files = ["item.lua", "plugin.sh"]
colors = ["blue", "magenta", "bg1"]
default_position = "right"
update_freq = 2
events = ["system_woke", "wifi_change"]

# How the item is drawn (a theme may set this in its palette):
#   plain  no background
#   pill   on bg1: one pill (unified) or one per rate (separate)
# There is no split: the icon belongs to the graph beside it.
[options.shape]
values = ["plain", "pill"]
default = "pill"

# unified: one graph, download filled in blue with the upload line in
#          magenta over it, and both rates stacked small beside it
# separate: a download item and an upload item, each with its own graph
[options.view]
values = ["unified", "separate"]
default = "unified"
