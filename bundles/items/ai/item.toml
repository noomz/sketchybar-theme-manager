# stm.ai — how much of your AI providers' quota is used, from the
# Agents Usage Bar cache (#26). Needs Agents Usage Bar (`aub`) installed and
# running; without it the item shows "no aub".
# Installed with `stm install item:ai`; options go in stm.config.toml
# (or a theme's palette) under [item.ai].
name = "ai"
version = "0.1.0"
dialects = ["lua"]
files = ["item.lua", "plugin.sh"]
colors = ["green", "yellow", "red", "grey", "white", "black", "bg1", "popup_bg", "popup_border"]
default_position = "right"
update_freq = 60
events = ["system_woke"]

# How the item is drawn (a theme may set this in its palette):
#   plain  <icon> <text>, no background
#   pill   [ <icon> <text> ], one bg1 background
#   split  [<icon>] [<text>]: the icon on the state colour, the text on bg1
[options.shape]
values = ["plain", "pill", "split"]
default = "split"

# What the text shows:
#   worst    the most used window, eg " 76% 7d"
#   windows  the 5h and 7d windows of that account, stacked
#   cost     today's spend across providers, eg "$126"
[options.view]
values = ["worst", "windows", "cost"]
default = "worst"

# Which provider the bar value comes from. The popup always lists all.
[options.provider]
values = ["all", "claude", "codex", "gemini", "grok"]
default = "all"
