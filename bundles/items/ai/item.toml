# stm.ai — how much of your AI providers' quota is used, one bar segment per
# provider, from the Agents Usage Bar cache (#26, #27). Needs Agents Usage Bar
# (`aub`) installed and running; without it the first segment shows "no aub".
# Installed with `stm install item:ai`; options go in stm.config.toml
# (or a theme's palette) under [item.ai].
name = "ai"
version = "0.5.0"
dialects = ["lua"]
files = ["item.lua", "plugin.sh"]
colors = ["green", "yellow", "red", "grey", "white", "black", "bg1", "popup_bg", "popup_border"]
default_position = "right"
update_freq = 60
events = ["system_woke"]

# The forms compact mode (item:compact) may ask for, widest first, for
# every segment at once:
#   full  the tags and the values
#   icon  the tags alone
compact = "full icon"

# How each segment is drawn (a theme may set this in its palette):
#   plain  <tag> <text>, no background
#   pill   [ <tag> <text> ], one bg1 background
#   split  [<tag>] [<text>]: the tag on the state colour, the text on bg1
[options.shape]
values = ["plain", "pill", "split"]
default = "split"

# What stands for each provider (stm ships no logo):
#   tag    a text tag: CL CX GE GK OR
#   image  your own <config dir>/icons/ai/<provider>.png (40x40 px), else the
#          installed app's icon (Claude; Codex, then ChatGPT), else the tag
[options.icon]
values = ["tag", "image"]
default = "tag"

# One key per provider: what its segment shows, or off for no segment.
#   auto     the first metric listed, and no segment while the provider has
#            no data (not signed in, not in aub)
#   worst    its most used window, eg " 76% 7d"
#   windows  its 5h and 7d (codex: weekly) windows, stacked
#   cost     today's spend, eg "$4.20"
# The rest name one window (claude 5h 7d sonnet opus, codex 5h weekly,
# grok billing), the OpenRouter credit balance, or the share of it used.
[options.claude]
values = ["auto", "worst", "5h", "7d", "sonnet", "opus", "windows", "cost", "off"]
default = "auto"

[options.codex]
values = ["auto", "worst", "5h", "weekly", "windows", "cost", "off"]
default = "auto"

[options.gemini]
values = ["auto", "worst", "off"]
default = "auto"

[options.grok]
values = ["auto", "billing", "off"]
default = "auto"

[options.openrouter]
values = ["auto", "balance", "quota", "off"]
default = "auto"

# One segment per provider, or one per account (up to 4; the last one's popup
# counts the rest). A provider without accounts keeps one segment.
#   merged  the provider's metric across its accounts
#   split   each account's own, its popup that account's windows
[options.accounts]
values = ["merged", "split"]
default = "merged"

# The account in front of a split segment's text:
#   short  the shortest prefix (1-3 letters) no other account of the provider
#          starts with, eg P W for personal, work; initial + slot number
#          (W1 W2) when some account has none
#   name   its name, cut to 8 characters
#   off    nothing (the popup still names it)
[options.account_label]
values = ["short", "name", "off"]
default = "short"

# The number on the bar and in the popup: used, or 100 minus it. The colours
# stay on the share used.
[options.percent]
values = ["used", "left"]
default = "used"

# The window after the number, eg " 7d", " wk".
[options.period]
values = ["on", "off"]
default = "on"

# The time to the window's reset after the number, eg 43m, 2h13m, 3d4h; --
# when aub does not say. Not with windows, cost or balance.
[options.reset]
values = ["off", "on"]
default = "off"

# Compact mode steps low items down first, then normal, then high; pin never
# leaves its full form.
[options.priority]
values = ["pin", "high", "normal", "low"]
default = "normal"
