# stm.date — the date (#19).
# Installed with `stm install item:date`; options go in stm.config.toml
# (or a theme's palette) under [item.date].
name = "date"
version = "0.2.0"
dialects = ["lua"]
files = ["item.lua"]
colors = ["blue", "bg1", "black"]
default_position = "right"
update_freq = 60
events = ["system_woke"]

# The forms compact mode (item:compact) may ask for, widest first:
#   full  the icon and the date
#   short the icon and the day of the month
#   icon  the icon alone
compact = "full short icon"

# How the item is drawn (a theme may set this in its palette):
#   plain  <icon> <text>, no background
#   pill   [ <icon> <text> ], one bg1 background
#   split  [<icon>] [<text>]: the icon on blue, the text on bg1
[options.shape]
values = ["plain", "pill", "split"]
default = "split"

# iso: 2026-10-01   short: Thu 01 Oct
[options.format]
values = ["iso", "short"]
default = "iso"

# Compact mode steps low items down first, then normal, then high; pin never
# leaves its full form.
[options.priority]
values = ["pin", "high", "normal", "low"]
default = "normal"
