# Catppuccin Latte (LIGHT) — https://github.com/catppuccin/catppuccin
# base #eff1f5 · mantle #e6e9ef · surface0 #ccd0da · surface1 #bcc0cc
# text #4c4f69 · overlay0 #9ca0b0
#
# Latte is a light theme, so black is the light BASE background and white
# is the dark TEXT colour. bg1/bg2 step toward grey, not toward white.

name = "Catppuccin Latte"
slug = "catppuccin-latte"
variant_label = "Latte"

[colors]
black = "0xffeff1f5"
white = "0xff4c4f69"
red = "0xffd20f39"
green = "0xff40a02b"
blue = "0xff1e66f5"
yellow = "0xffdf8e1d"
orange = "0xfffe640b"
magenta = "0xff8839ef"
grey = "0xff9ca0b0"
bg1 = "0xffe6e9ef"
bg2 = "0xffccd0da"
bar_bg = "0x00eff1f5"
bar_border = "0xffbcc0cc"
popup_bg = "0xc0e6e9ef"
popup_border = "0xff9ca0b0"

# --- bash dialect: Catppuccin 26-colour naming ------------------------------
# Values from AwesomeAdil/dotfiles palettes/latte.sh, the most widely used bash
# SketchyBar theme switcher. A colors.sh naming its variables this way gets
# them swapped automatically.
# Not repeated here (the canonical key above already defines them): red yellow green blue
rosewater = "0xffdc8a78"
flamingo = "0xffdd7878"
pink = "0xffea76cb"
mauve = "0xff8839ef"
maroon = "0xffe64553"
peach = "0xfffe640b"
teal = "0xff179299"
sky = "0xff04a5e5"
sapphire = "0xff209fb5"
lavender = "0xff7287fd"
text = "0xff4c4f69"
subtext1 = "0xff5c5f77"
subtext0 = "0xff6c6f85"
overlay2 = "0xff7c7f93"
overlay1 = "0xff8c8fa1"
overlay0 = "0xff9ca0b0"
surface2 = "0xffacb0be"
surface1 = "0xffbcc0cc"
surface0 = "0xffccd0da"
base = "0xffeff1f5"
mantle = "0xffe6e9ef"
crust = "0xffdce0e8"

# Semantic keys that carry a literal 0x value in colors.sh. Reference lines
# such as 'export ITEM_BG_COLOR=$SURFACE0' are preserved untouched and need
# no palette key.
bar_color = "0xccccd0da"
bar_border_color = "0x00000000"
