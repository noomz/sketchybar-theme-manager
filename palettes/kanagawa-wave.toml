# carpYellow #e6c384 · surimiOrange #ffa066 · oniViolet #957fb8
#
# red is waveRed, not autumnRed (#c34043, Kanagawa's ANSI red): autumnRed is
# too dark to read as a status colour on the sumiInk bar.

name = "Kanagawa Wave"
slug = "kanagawa-wave"
variant_label = "Kanagawa Wave"

[colors]
black = "0xff1f1f28"
white = "0xffdcd7ba"
red = "0xffe46876"
green = "0xff98bb6c"
blue = "0xff7e9cd8"
