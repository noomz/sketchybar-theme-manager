# --- bash dialect: Catppuccin 26-colour naming ------------------------------
# AwesomeAdil/dotfiles has no Kanagawa palette, so stm maps these from the
# kanagawa.nvim names. A colors.sh naming its variables this way gets them
# swapped automatically.
# Not repeated here (the canonical key above already defines them): red yellow green blue
rosewater = "0xffd27e99"
flamingo = "0xffd27e99"
pink = "0xffd27e99"
mauve = "0xff957fb8"
maroon = "0xffff5d62"
peach = "0xffffa066"
teal = "0xff7aa89f"
sky = "0xff7fb4ca"
sapphire = "0xffa3d4d5"
lavender = "0xff9cabca"
text = "0xffdcd7ba"
subtext1 = "0xffc8c093"
subtext0 = "0xff938aa9"
overlay2 = "0xff717c7c"
overlay1 = "0xff727169"
overlay0 = "0xff54546d"
surface2 = "0xff54546d"
surface1 = "0xff363646"
surface0 = "0xff2a2a37"
base = "0xff1f1f28"
mantle = "0xff1a1a22"
crust = "0xff16161d"

# Semantic keys that carry a literal 0x value in colors.sh. Reference lines
# such as 'export ITEM_BG_COLOR=$SURFACE0' are preserved untouched and need
# no palette key.
bar_color = "0xcc2a2a37"
bar_border_color = "0x00000000"
