# Nord — https://www.nordtheme.com/docs/colors-and-palettes
# nord0 #2e3440 · nord1 #3b4252 · nord2 #434c5e · nord3 #4c566a · nord4 #d8dee9
# nord9 #81a1c1 · nord11 #bf616a · nord12 #d08770 · nord13 #ebcb8b
# nord14 #a3be8c · nord15 #b48ead
#
# blue is nord9, not nord8. Nord's own terminal palette maps nord9 to ANSI blue
# and nord8 (#88c0d0) to ANSI cyan.

name = "Nord"
slug = "nord"
variant_label = "Nord"

[colors]
black = "0xff2e3440"
white = "0xffd8dee9"
red = "0xffbf616a"
green = "0xffa3be8c"
blue = "0xff81a1c1"
yellow = "0xffebcb8b"
orange = "0xffd08770"
magenta = "0xffb48ead"
grey = "0xff4c566a"
bg1 = "0xff3b4252"
bg2 = "0xff434c5e"
bar_bg = "0x002e3440"
bar_border = "0xff434c5e"
popup_bg = "0xc03b4252"
popup_border = "0xff4c566a"

# --- bash dialect: Catppuccin 26-colour naming ------------------------------
# Values from AwesomeAdil/dotfiles palettes/nord.sh, the most widely used bash
# SketchyBar theme switcher. A colors.sh naming its variables this way gets
# them swapped automatically.
# Not repeated here (the canonical key above already defines them): red yellow green blue
rosewater = "0xffd08770"
flamingo = "0xffd08770"
pink = "0xffb48ead"
mauve = "0xffb48ead"
maroon = "0xffbf616a"
peach = "0xffd08770"
teal = "0xff8fbcbb"
sky = "0xff88c0d0"
sapphire = "0xff81a1c1"
lavender = "0xff81a1c1"
text = "0xffeceff4"
subtext1 = "0xffe5e9f0"
subtext0 = "0xffd8dee9"
overlay2 = "0xffaeb5c3"
overlay1 = "0xff8b93a3"
overlay0 = "0xff687183"
surface2 = "0xff4c566a"
surface1 = "0xff434c5e"
surface0 = "0xff3b4252"
base = "0xff2e3440"
mantle = "0xff252a33"
crust = "0xff1c1f26"

# Semantic keys that carry a literal 0x value in colors.sh. Reference lines
# such as `export ITEM_BG_COLOR=$SURFACE0` are preserved untouched and need
# no palette key.
bar_color = "0xcc3b4252"
bar_border_color = "0x00000000"
