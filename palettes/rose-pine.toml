# Rosé Pine (main) — https://rosepinetheme.com/palette/
# base #191724 · surface #1f1d2e · overlay #26233a · highlight-med #403d52
# text #e0def4 · muted #6e6a86 · love #eb6f92 · gold #f6c177 · rose #ebbcba
# pine #31748f · foam #9ccfd8 · iris #c4a7e7
#
# Rose Pine has no dedicated green; foam (its cyan-green) fills that slot and
# pine fills blue. rose fills orange.

name = "Rose Pine"
slug = "rose-pine"
variant_label = "Rose Pine (main)"

[colors]
black = "0xff191724"
white = "0xffe0def4"
red = "0xffeb6f92"
green = "0xff9ccfd8"
blue = "0xff31748f"
yellow = "0xfff6c177"
orange = "0xffebbcba"
magenta = "0xffc4a7e7"
grey = "0xff6e6a86"
bg1 = "0xff1f1d2e"
bg2 = "0xff26233a"
bar_bg = "0x00191724"
bar_border = "0xff403d52"
popup_bg = "0xc01f1d2e"
popup_border = "0xff6e6a86"

# --- bash dialect: Catppuccin 26-colour naming ------------------------------
# Values from AwesomeAdil/dotfiles palettes/rose-pine.sh, the most widely used bash
# SketchyBar theme switcher. A colors.sh naming its variables this way gets
# them swapped automatically.
# Not repeated here (the canonical key above already defines them): red yellow green blue
rosewater = "0xffebbcba"
flamingo = "0xffebbcba"
pink = "0xffeb6f92"
mauve = "0xffc4a7e7"
maroon = "0xffeb6f92"
peach = "0xfff6c177"
teal = "0xff9ccfd8"
sky = "0xff9ccfd8"
sapphire = "0xff31748f"
lavender = "0xffc4a7e7"
text = "0xffe0def4"
subtext1 = "0xffc6c3dc"
subtext0 = "0xffaba8c3"
overlay2 = "0xff908caa"
overlay1 = "0xff7f7b98"
overlay0 = "0xff6e6a86"
surface2 = "0xff524f67"
surface1 = "0xff403d52"
surface0 = "0xff26233a"
base = "0xff191724"
mantle = "0xff14131e"
crust = "0xff100e16"

# Semantic keys that carry a literal 0x value in colors.sh. Reference lines
# such as 'export ITEM_BG_COLOR=$SURFACE0' are preserved untouched and need
# no palette key.
bar_color = "0xcc26233a"
bar_border_color = "0x00000000"
